<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moovie · CineStream</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            overflow: hidden;
        }
        #player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        .status-overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0b0a08;
            padding: 1.5rem;
            text-align: center;
        }
        .status-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 90, 31, 0.15);
            border-top-color: #ff5a1f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.25rem;
        }
        .status-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 0.5rem;
            color: #f5efe4;
        }
        .status-subtitle {
            font-size: 0.95rem;
            color: #9ca3af;
            max-width: 400px;
            line-height: 1.5;
            margin: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        video {
            width: 100%;
            height: 100%;
            background: #000;
            object-fit: contain;
        }
    </style>
    <!-- Ad tag -->
    <script data-cfasync="false">
      (function () {
        try {
          if (localStorage.getItem('ads_hidden') === 'true') return;
        } catch (e) {}
        var s = document.createElement('script');
        s.setAttribute('data-cfasync', 'false');
        s.src = '//dc9xwpjprguup.cloudfront.net/?pwxcd=1436467';
        document.head.appendChild(s);
      })();
    </script>
</head>
<body>
    <div id="player-container">
        <div id="status-overlay" class="status-overlay">
            <div id="status-spinner" class="status-spinner"></div>
            <div id="status-icon" style="display:none;font-size:3rem;margin-bottom:1rem;">!</div>
            <h2 id="status-title" class="status-title">Starting Moovie stream…</h2>
            <p id="status-subtitle" class="status-subtitle">Connecting to Moovie catalogue resolver</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tmdbId = urlParams.get('tmdb_id') || '';
        const season = urlParams.get('season') || '';
        const episode = urlParams.get('episode') || '';

        const overlay = document.getElementById('status-overlay');
        const spinner = document.getElementById('status-spinner');
        const icon = document.getElementById('status-icon');
        const title = document.getElementById('status-title');
        const subtitle = document.getElementById('status-subtitle');

        function showError(msg) {
            spinner.style.display = 'none';
            icon.style.display = 'block';
            title.textContent = 'Moovie stream failed';
            subtitle.textContent = msg || 'Could not resolve a playable stream.';
        }

        async function initPlayer() {
            if (!tmdbId) {
                showError('Missing tmdb_id parameter.');
                return;
            }

            const type = season && episode ? 'tv' : 'movie';
            const serverIds = ['1', '2', '3', '6'];
            let success = false;
            let lastError = null;

            for (const serverId of serverIds) {
                try {
                    subtitle.textContent = `Fetching stream from catalogue resolver (Server ${serverId})…`;
                    const params = new URLSearchParams({
                        action: 'resolve',
                        type,
                        id: tmdbId,
                        se: season || '0',
                        ep: episode || '0',
                        server: serverId
                    });

                    const res = await fetch('/api/moovie-catalog?' + params.toString());
                    const text = await res.text();
                    let data;
                    try { data = JSON.parse(text); } catch (e) {
                        throw new Error('Resolver returned invalid response.');
                    }
                    if (!res.ok) throw new Error(data.error || 'Resolve failed (' + res.status + ')');
                    if (!data.streams || !data.streams.length) {
                        throw new Error('No playable streams found.');
                    }

                    overlay.style.display = 'none';

                    const streamUrl = data.streams[0].url;
                    const video = document.createElement('video');
                    video.controls = true;
                    video.playsInline = true;
                    video.autoplay = true;
                    video.crossOrigin = 'anonymous';
                    document.getElementById('player-container').appendChild(video);

                    const isDash = streamUrl.includes('.mpd');
                    const isHls = streamUrl.includes('.m3u8');

                    if (isHls && typeof Hls !== 'undefined' && Hls.isSupported()) {
                        const hls = new Hls({ maxMaxBufferLength: 30, enableWorker: true });
                        hls.loadSource(streamUrl);
                        hls.attachMedia(video);
                    } else if (isDash && typeof dashjs !== 'undefined') {
                        const player = dashjs.MediaPlayer().create();
                        player.initialize(video, streamUrl, true);
                    } else {
                        video.src = streamUrl;
                    }

                    success = true;
                    break;
                } catch (err) {
                    console.warn(`Server ${serverId} failed:`, err.message);
                    lastError = err.message;
                }
            }

            if (!success) {
                showError(lastError || 'All catalogue servers returned offline status.');
            }
        }

        if (typeof Hls === 'undefined') {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
            s.onload = initPlayer;
            document.head.appendChild(s);
        } else {
            window.addEventListener('DOMContentLoaded', initPlayer);
        }
    </script>
</body>
</html>
